<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Default meta. Le pagine sovrascrivono queste via <PageMeta /> al mount. -->
    <title>ATS — Al TuO Servizio · Hospitality fatta bene</title>
    <meta name="description" content="ATS è una società di catering HORECA con dipendenti diretti. Strutture e lavoratori, in regola e collegati. Operiamo a Benevento e provincia." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://ats-servizio.it/" />

    <!-- PWA: manifest + theme color (Chrome/Edge mobile) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#06101E" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS Safari "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ATS" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Telegram) -->
    <meta property="og:title" content="ATS — Al TuO Servizio · Hospitality fatta bene" />
    <meta property="og:description" content="Catering HORECA con dipendenti diretti. Strutture e lavoratori, in regola e collegati." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://ats-servizio.it/" />
    <meta property="og:image" content="https://ats-servizio.it/og-image.svg" />
    <meta property="og:site_name" content="ATS — Al TuO Servizio" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ATS — Al TuO Servizio · Hospitality fatta bene" />
    <meta name="twitter:description" content="Catering HORECA con dipendenti diretti. Strutture e lavoratori, in regola e collegati." />
    <meta name="twitter:image" content="https://ats-servizio.it/og-image.svg" />

    <!-- JSON-LD Organization (rich snippet base) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ATS — Al TuO Servizio",
      "alternateName": "ATS",
      "url": "https://ats-servizio.it/",
      "logo": "https://ats-servizio.it/og-image.svg",
      "description": "Società di catering HORECA con dipendenti diretti. Strutture e lavoratori, in regola e collegati.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Benevento",
        "addressRegion": "BN",
        "addressCountry": "IT"
      },
      "areaServed": {
        "@type": "AdministrativeArea",
        "name": "Provincia di Benevento"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
