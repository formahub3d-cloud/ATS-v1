<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06101E"/>
      <stop offset="100%" stop-color="#0D1E34"/>
    </linearGradient>
    <radialGradient id="glowSky" cx="0.25" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#5BB8F5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#5BB8F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.85" cy="0.85" r="0.45">
      <stop offset="0%" stop-color="#1EC99A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1EC99A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5BB8F5"/>
      <stop offset="100%" stop-color="#3AA3E8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowSky)"/>
  <rect width="1200" height="630" fill="url(#glowGreen)"/>

  <!-- Subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <line x1="0"   y1="158" x2="1200" y2="158"/>
    <line x1="0"   y1="316" x2="1200" y2="316"/>
    <line x1="0"   y1="474" x2="1200" y2="474"/>
    <line x1="240" y1="0"   x2="240"  y2="630"/>
    <line x1="480" y1="0"   x2="480"  y2="630"/>
    <line x1="720" y1="0"   x2="720"  y2="630"/>
    <line x1="960" y1="0"   x2="960"  y2="630"/>
  </g>

  <!-- Logo bracket "ATS" mark -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#5BB8F5" fill-opacity="0.12" stroke="#5BB8F5" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="32" y="44" font-family="Georgia, 'Playfair Display', serif" font-size="32" font-weight="700" fill="#5BB8F5" text-anchor="middle">A</text>
  </g>

  <text x="190" y="148" font-family="Georgia, 'Playfair Display', serif" font-size="36" font-weight="700" fill="#FFFFFF">ATS</text>
  <text x="190" y="178" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#94A3B8" letter-spacing="2">AL TUO SERVIZIO</text>

  <!-- Headline -->
  <text x="100" y="320" font-family="Georgia, 'Playfair Display', serif" font-size="68" font-weight="700" fill="#FFFFFF">
    Hospitality
  </text>
  <text x="100" y="402" font-family="Georgia, 'Playfair Display', serif" font-size="68" font-weight="700" fill="url(#textGrad)">
    fatta bene.
  </text>

  <!-- Sub copy -->
  <text x="100" y="465" font-family="-apple-system, system-ui, sans-serif" font-size="24" fill="#B8C5D6">
    Catering HORECA con dipendenti diretti.
  </text>
  <text x="100" y="498" font-family="-apple-system, system-ui, sans-serif" font-size="24" fill="#B8C5D6">
    Strutture e lavoratori, in regola e collegati.
  </text>

  <!-- Footer pill -->
  <g transform="translate(100, 540)">
    <rect x="0" y="0" width="190" height="38" rx="19" fill="#1EC99A" fill-opacity="0.12" stroke="#1EC99A" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#1EC99A"/>
    <text x="36" y="25" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#1EC99A" letter-spacing="0.5">
      Made in Benevento
    </text>
  </g>

  <!-- Right column accent -->
  <g transform="translate(900, 250)" opacity="0.85">
    <circle cx="80" cy="80" r="76" fill="none" stroke="#5BB8F5" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="56" fill="none" stroke="#5BB8F5" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="36" fill="none" stroke="#5BB8F5" stroke-opacity="0.7" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="14" fill="#5BB8F5"/>
  </g>
</svg>
