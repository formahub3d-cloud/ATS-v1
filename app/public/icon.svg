<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06101E"/>
      <stop offset="100%" stop-color="#0D1E34"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BB8F5"/>
      <stop offset="100%" stop-color="#3AA3E8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5BB8F5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5BB8F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Safe area maskable: il contenuto centrale sta in un cerchio di r=205
       (zona safe per Android adaptive icon ~80%). -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>

  <!-- Lettera "A" stilizzata in Playfair-style -->
  <text
    x="256" y="356"
    font-family="Georgia, 'Playfair Display', 'Times New Roman', serif"
    font-size="280"
    font-weight="700"
    fill="url(#text)"
    text-anchor="middle"
  >A</text>

  <!-- Underline: simbolo di "servizio" -->
  <rect x="186" y="380" width="140" height="6" rx="3" fill="#5BB8F5" opacity="0.85"/>
</svg>
